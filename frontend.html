<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeachBack AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --ink:#16241f; --ink-soft:#223930; --rule:#3c5049; --chalk:#eef1e6; --chalk-dim:#dfe4d6;
  --paper:#f8f7f1; --ink-on-paper:#1c2b25; --marker:#d99a2b; --marker-deep:#a9701a;
  --verified:#3f8f78; --verified-deep:#2c6a58; --alert:#b8503a; --alert-deep:#8f3c2a;
  --font-display:"Fraunces","Iowan Old Style",serif; --font-body:"IBM Plex Sans","Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",monospace; --radius-card:3px; --rail-width:230px;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--chalk); color:var(--ink-on-paper); font-family:var(--font-body); font-size:16px; line-height:1.5; }
h1,h2,h3 { font-family:var(--font-display); font-weight:500; margin:0; color:var(--ink); }
button { font-family: var(--font-body); }
.btn { display:inline-flex; align-items:center; gap:.5em; border:1.5px solid var(--ink); background:var(--ink); color:var(--chalk); font-weight:500; font-size:.95rem; padding:.65em 1.3em; border-radius:var(--radius-card); cursor:pointer; }
.btn:hover { background: var(--ink-soft); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn-ghost { background:transparent; color:var(--ink); border-color:var(--rule); }
.btn-ghost:hover { background: var(--chalk-dim); }
.btn-marker { background: var(--marker); border-color: var(--marker-deep); color: var(--ink); }
.btn-marker:hover { background: var(--marker-deep); color: var(--chalk); }
.btn-small { padding:.4em .9em; font-size:.82rem; }
textarea, input { font-family: var(--font-body); border:1.5px solid var(--rule); border-radius: var(--radius-card); padding:.75em; background: var(--paper); color: var(--ink-on-paper); width:100%; }
textarea:focus, input:focus { border-color: var(--marker-deep); outline: none; }
label { font-size:.82rem; color: var(--ink-soft); display:block; margin-bottom:.3rem; }
.field { margin-bottom: 1rem; }
.page { max-width: 900px; margin:0 auto; padding: 2.5rem 1.5rem 5rem; }
.eyebrow-free-label { font-size:.8rem; color: var(--rule); }
.navbar { background: var(--ink); color: var(--chalk); display:flex; align-items:center; justify-content:space-between; padding: 1.1rem 1.75rem; position: sticky; top:0; z-index:20; }
.navbar__wordmark { font-family: var(--font-display); font-size:1.25rem; background:none; border:none; color:var(--chalk); cursor:pointer; padding:0; }
.navbar__wordmark span { color: var(--marker); }
.navbar__links { display:flex; gap:1.5rem; align-items:center; }
.navbar__links button.link { background:none; border:none; color: var(--chalk-dim); border-bottom:2px solid transparent; padding:0 0 .15rem; cursor:pointer; font-size:.95rem; }
.navbar__links button.link:hover { color: var(--chalk); }
.navbar__links button.link.is-active { color: var(--chalk); border-bottom-color: var(--marker); }
.navbar__logout { border:1px solid var(--rule); background:transparent; color:var(--chalk-dim); border-radius:var(--radius-card); padding:.35em .8em; font-size:.82rem; cursor:pointer; }
.navbar__logout:hover { color: var(--chalk); border-color: var(--chalk-dim); }
.api-bar { background: var(--paper); border-bottom: 1.5px solid var(--chalk-dim); font-size:.82rem; padding: .5rem 1.5rem; display:flex; gap:.6rem; align-items:center; color: var(--ink-soft); }
.api-bar input { flex: 0 1 320px; padding: .3em .5em; font-family: var(--font-mono); font-size: .82rem; }
.api-bar__dot { width:.5rem; height:.5rem; border-radius:50%; background: var(--alert); flex-shrink:0; }
.api-bar__dot.ok { background: var(--verified); }

/* ---- Auth (the "class register") ---- */
.auth-page { max-width: 980px; margin: 0 auto; padding: 3.5rem 1.5rem 5rem; display:grid; grid-template-columns: 1.1fr 1fr; gap: 3rem; align-items:center; }
.auth-page__intro h1 { font-size: 2.4rem; line-height:1.15; margin-bottom: 1rem; }
.auth-page__intro p { color: var(--ink-soft); max-width: 42ch; }
.auth-card { background: var(--paper); border: 1.5px solid var(--chalk-dim); border-top: 5px solid var(--marker-deep); border-radius: var(--radius-card); padding: 2rem 2.2rem; }
.auth-card__tab { font-size:.78rem; color: var(--rule); margin-bottom:.3rem; }
.auth-card h2 { font-size: 1.4rem; margin-bottom: 1.4rem; }
.auth-card__switch { margin-top: 1.2rem; font-size: .88rem; color: var(--ink-soft); text-align:center; }
.auth-card__switch button { background:none; border:none; color: var(--marker-deep); font-weight:500; cursor:pointer; padding:0; font-size:.88rem; text-decoration: underline; }
.auth-card__error { background: rgba(184,80,58,.1); border:1px solid var(--alert); color: var(--alert-deep); padding:.65rem .9rem; border-radius: var(--radius-card); font-size:.85rem; margin-bottom:1rem; }
.auth-card__row { display:flex; gap:.8rem; }
.auth-card__row .field { flex:1; }

.hero { display:block; text-align:center; padding: 2.5rem 0 3.5rem; border-bottom: 1.5px solid var(--chalk-dim); }
.hero__text { max-width: 620px; margin: 0 auto; }
.hero__welcome { font-family: var(--font-mono); text-transform: uppercase; letter-spacing:.09em; font-size:.85rem; color: var(--marker-deep); margin: 0 0 .9rem; }
.hero__text h1 { font-size:2.6rem; line-height:1.12; margin-bottom:1.1rem; }
.hero__text p { max-width:46ch; color: var(--ink-soft); margin-left:auto; margin-right:auto; }
.library { padding-top:3rem; }
.library__header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1.5rem; flex-wrap:wrap; gap:.5rem; }
.library__grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap:1.1rem; }
.concept-card { background: var(--paper); border:1.5px solid var(--chalk-dim); border-top:5px solid var(--rule); border-radius: var(--radius-card); padding:1.1rem 1.2rem 1.3rem; display:flex; flex-direction:column; gap:.55rem; }
.concept-card[data-difficulty="beginner"] { border-top-color: var(--verified); }
.concept-card[data-difficulty="intermediate"] { border-top-color: var(--marker-deep); }
.concept-card__tab { font-size:.78rem; color: var(--rule); }
.concept-card h3 { font-size:1.15rem; }
.concept-card p { color: var(--ink-soft); font-size:.92rem; flex-grow:1; }
.concept-card__foot { display:flex; justify-content:space-between; align-items:center; margin-top:.4rem; }
.concept-card__difficulty { font-size:.82rem; color: var(--rule); }
.start-panel { position: sticky; bottom: 1.25rem; margin-top: 2.5rem; }
.start-panel__inner { background: var(--ink); color: var(--chalk); border-radius: var(--radius-card); padding: 1.4rem 1.6rem; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
.start-panel__inner h3 { color: var(--chalk); font-size:1.2rem; margin-bottom:.4rem; }
.start-panel__inner p { color: var(--chalk-dim); font-size:.92rem; margin:.3rem 0; }
.start-panel__question { margin-top:.9rem; font-weight:500; color: var(--chalk); }
.start-panel__hint { font-size: .78rem; color: var(--chalk-dim); margin-top: -.4rem; }
.start-panel__scale { display:flex; gap:.5rem; margin:.6rem 0 .3rem; }
.scale-dot { width:2.2rem; height:2.2rem; border-radius:50%; border:1.5px solid var(--rule); background:transparent; color:var(--chalk); cursor:pointer; }
.scale-dot.is-selected { background: var(--marker); border-color: var(--marker); color: var(--ink); }
.start-panel__actions { display:flex; justify-content:flex-end; gap:.75rem; margin-top: 1rem;}

.session-page { display:grid; grid-template-columns: var(--rail-width) 1fr; gap:2.5rem; align-items:start; }
.stage-rail { background: var(--ink); color: var(--chalk); border-radius: var(--radius-card); padding:1.4rem 1.2rem; position: sticky; top: 5.5rem; }
.stage-rail ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1.1rem; }
.stage-rail li { display:flex; align-items:flex-start; gap:.7rem; font-size:.9rem; color: var(--chalk-dim); }
.stage-rail__marker { flex-shrink:0; width:1.5rem; height:1.5rem; border-radius:50%; border:1.5px solid var(--rule); display:flex; align-items:center; justify-content:center; font-size:.75rem; }
.stage-rail li[data-state="active"] { color: var(--chalk); }
.stage-rail li[data-state="active"] .stage-rail__marker { background: var(--marker); border-color: var(--marker); color: var(--ink); }
.stage-rail li[data-state="done"] .stage-rail__marker { background: var(--verified); border-color: var(--verified); color: var(--ink); }
.stage-rail__attempt { margin: 1rem 0 0; font-size:.8rem; color: var(--chalk-dim); border-top:1px solid var(--rule); padding-top:.8rem; }
.session-page__header { margin-bottom: 1.75rem; }
.session-page__header h1 { font-size:2rem; margin:.2rem 0 .5rem; }
.session-page__objective { color: var(--ink-soft); max-width:60ch; }
.teach-form__prompt { display:flex; gap:.75rem; margin-bottom:.75rem; }
.teach-form__role { font-family: var(--font-mono); font-size:.78rem; border:1px solid var(--rule); border-radius:2px; padding:.2em .55em; color: var(--ink-soft); }
.teach-form__role--ai { border-color: var(--marker-deep); color: var(--marker-deep); }
.teach-form__instruction { color: var(--ink-soft); margin-bottom:.9rem; }
.teach-form textarea { font-family: var(--font-mono); font-size:.95rem; resize:vertical; }
.teach-form__actions { display:flex; justify-content:flex-end; margin-top:1rem; gap:.75rem; }
.diagnosis__block { background: var(--paper); border:1.5px solid var(--chalk-dim); border-radius: var(--radius-card); padding:1.25rem 1.4rem; margin-bottom:1.25rem; }
.diagnosis__block h2 { font-size:1.05rem; margin-bottom:.9rem; }
.diagnosis__status { margin-top:.9rem; color: var(--ink-soft); }
.score-bars__row { display:grid; grid-template-columns: 11rem 1fr 3rem; align-items:center; gap:.75rem; margin-bottom:.55rem; font-size:.9rem; }
.score-bars__track { height:8px; background: var(--chalk-dim); border-radius:6px; overflow:hidden; }
.score-bars__fill { height:100%; background: var(--verified); border-radius:6px; }
.score-bars__fill[data-low="true"] { background: var(--alert); }
.score-bars__value { text-align:right; font-family: var(--font-mono); font-size:.82rem; }
.gap-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.65rem; }
.gap-list li { display:flex; gap:.6rem; align-items:baseline; font-size:.92rem; }
.gap-list__badge { flex-shrink:0; font-size:.72rem; padding:.15em .5em; border-radius:3px; border:1px solid var(--rule); color: var(--ink-soft); white-space:nowrap; }
.gap-list li[data-type="MISCONCEPTION"] .gap-list__badge { border-color: var(--alert-deep); color: var(--alert-deep); }
.gap-list li[data-type="REASONING_GAP"] .gap-list__badge { border-color: var(--marker-deep); color: var(--marker-deep); }
.gap-list__empty { color: var(--ink-soft); }
.challenge-card__question { font-family: var(--font-display); font-size:1.15rem; font-style:italic; margin-bottom:.6rem; }
.level-badge { display:inline-block; font-family: var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; border:1px solid var(--rule); color: var(--ink-soft); border-radius:3px; padding:.1em .5em; margin-bottom:.9rem; }
.level-badge[data-level="advanced"] { border-color: var(--marker-deep); color: var(--marker-deep); }
.challenge-verdict { display:inline-block; font-family: var(--font-mono); font-size:.85rem; padding:.25em .65em; border-radius:3px; margin-bottom:.9rem; }
.challenge-verdict--correct { background: rgba(63,143,120,.15); color: var(--verified-deep); }
.challenge-verdict--partial { background: rgba(217,154,43,.18); color: var(--marker-deep); }
.challenge-verdict--incorrect { background: rgba(184,80,58,.15); color: var(--alert-deep); }
.combined-answer { border-left: 3px solid var(--marker-deep); background: rgba(217,154,43,.07); padding: .9rem 1.1rem; border-radius: 2px; font-size: .95rem; margin: .9rem 0; }
.combined-answer strong { color: var(--ink); }
.repair-panel__block { margin-bottom:.9rem; }
.repair-panel__block h4 { font-size:.82rem; color: var(--rule); margin:0 0 .25rem; }
.repair-panel__mini { border-top:1px dashed var(--chalk-dim); padding-top:.75rem; font-size:.92rem; }
.repair-panel__mini summary { cursor:pointer; font-weight:500; }
.verified-panel { background: var(--paper); border:1.5px solid var(--verified); border-radius: var(--radius-card); padding:1.75rem 1.9rem; }
.verified-panel h2 { color: var(--verified-deep); margin-bottom:.6rem; }
.more-detail-prompt { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px dashed var(--chalk-dim); }
.more-detail-prompt p { font-weight: 500; margin-bottom: .7rem; }
.thanks-panel { text-align:center; padding: 1.5rem 0; }
.thanks-panel h3 { font-size: 1.3rem; margin-bottom: .5rem; }
.thanks-panel p { color: var(--ink-soft); margin-bottom: 1.2rem; }
.retry-link { margin-top: .9rem; font-size: .85rem; text-align:center; }
.retry-link button { background:none; border:none; color: var(--rule); text-decoration:underline; cursor:pointer; font-size:.85rem; }

/* ---- Written questions ---- */
.written-q { margin-bottom: 1.3rem; }
.written-q label { font-size:.95rem; color: var(--ink); font-weight:500; margin-bottom:.4rem; }
.written-q textarea { min-height: 5rem; }
.review-list__line.written-answer { white-space: pre-wrap; }

/* ---- Quiz ---- */
.quiz-meta { font-family: var(--font-mono); font-size:.8rem; color: var(--rule); margin:.2rem 0 .9rem; }
.option-list { display:flex; flex-direction:column; gap:.6rem; margin: 1rem 0 .4rem; }
.option-btn { display:flex; gap:.8rem; align-items:baseline; text-align:left; width:100%; background: var(--paper); color: var(--ink-on-paper); border:1.5px solid var(--rule); border-radius: var(--radius-card); padding:.7em .9em; font-size:.95rem; cursor:pointer; }
.option-btn:hover:not(:disabled) { background: var(--chalk-dim); }
.option-btn:disabled { cursor: default; }
.option-btn__letter { font-family: var(--font-mono); font-size:.8rem; color: var(--rule); flex-shrink:0; }
.option-btn.is-selected { border-color: var(--marker-deep); background: rgba(217,154,43,.15); }
.option-btn.is-correct { border-color: var(--verified); background: rgba(63,143,120,.15); }
.option-btn.is-wrong { border-color: var(--alert); background: rgba(184,80,58,.12); }
.option-btn__tag { margin-left:auto; font-size:.75rem; font-family: var(--font-mono); white-space:nowrap; }
.final-score { font-family: var(--font-display); font-size: 2.6rem; color: var(--ink); margin: .2rem 0 .6rem; }
.final-score small { font-size: 1rem; color: var(--rule); font-family: var(--font-body); }
.review-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1rem; }
.review-list li { border-left:4px solid var(--alert); background: var(--paper); border-radius:2px; padding:.8rem 1rem; font-size:.92rem; }
.review-list li[data-correct="true"] { border-left-color: var(--verified); }
.review-list__q { font-weight:500; margin-bottom:.35rem; }
.review-list__line { color: var(--ink-soft); }
.review-list__line strong { color: var(--ink); }
.review-list__why { margin-top:.4rem; color: var(--ink-soft); font-size:.88rem; }
.final-actions { display:flex; gap:.75rem; flex-wrap:wrap; margin-top:1.5rem; }

/* ---- Dashboard ---- */
.dashboard-page h1 { font-size:2rem; margin-bottom: 1.5rem; }
.dash-tabs { display:flex; gap: .5rem; border-bottom: 1.5px solid var(--chalk-dim); margin-bottom: 2rem; }
.dash-tabs button { background:none; border:none; padding: .6em 1em; font-size: .92rem; color: var(--ink-soft); cursor:pointer; border-bottom: 2px solid transparent; margin-bottom:-1.5px; }
.dash-tabs button.is-active { color: var(--ink); border-bottom-color: var(--marker); font-weight: 500; }
.profile-card { background: var(--paper); border: 1.5px solid var(--chalk-dim); border-radius: var(--radius-card); padding: 1.6rem 1.8rem; max-width: 480px; }
.profile-card__row { display:flex; justify-content:space-between; padding: .55rem 0; border-bottom: 1px solid var(--chalk-dim); font-size: .92rem; }
.profile-card__row:last-of-type { border-bottom: none; }
.profile-card__label { color: var(--rule); }
.progress-page__intro { color: var(--ink-soft); margin-bottom:2rem; }
.progress-page__empty { color: var(--ink-soft); }
.ledger { border-top: 1.5px solid var(--chalk-dim); }
.ledger__row { display:grid; grid-template-columns: 14rem 1fr 3.2rem 6rem; align-items:center; gap:1rem; padding:.85rem 0; border-bottom:1.5px solid var(--chalk-dim); }
.ledger__name { display:flex; flex-direction:column; gap:.2rem; font-weight:500; }
.ledger__status { font-size:.75rem; font-weight:400; color: var(--rule); }
.ledger__status--verified { color: var(--verified-deep); }
.ledger__status--needs_reinforcement { color: var(--marker-deep); }
.ledger__bar { height:8px; background: var(--chalk-dim); border-radius:6px; overflow:hidden; }
.ledger__fill { height:100%; background: var(--verified); }
.ledger__score { font-family: var(--font-mono); font-size:.85rem; text-align:right; }
.ledger__attempts { font-size:.8rem; color: var(--rule); text-align:right; }
.history-table { width:100%; border-collapse: collapse; font-size: .9rem; }
.history-table th { text-align:left; font-weight:500; color: var(--rule); font-size: .78rem; text-transform: uppercase; letter-spacing:.03em; padding: .5rem .4rem; border-bottom: 1.5px solid var(--chalk-dim); }
.history-table td { padding: .65rem .4rem; border-bottom: 1px solid var(--chalk-dim); }
.history-table tr:hover td { background: var(--paper); }
.weak-areas { margin-top:3rem; }
.weak-areas h2 { font-size:1.2rem; margin-bottom:1rem; }
.weak-areas ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.9rem; }
.weak-areas li { background: var(--paper); border-left:3px solid var(--marker-deep); border-radius:2px; padding:.7rem 1rem; display:flex; flex-direction:column; gap:.2rem; }
.weak-areas__concept { font-size:.78rem; color: var(--rule); }
.weak-areas__desc { font-size:.92rem; }
.error-banner { background: rgba(184,80,58,.12); border:1px solid var(--alert); color: var(--alert-deep); padding:.8rem 1rem; border-radius: var(--radius-card); margin-bottom:1.5rem; font-size:.9rem; }
@media (max-width: 760px) { .session-page { grid-template-columns: 1fr; } .stage-rail { position: static; } }
@media (max-width: 720px) { .auth-page { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .ledger__row { grid-template-columns: 1fr; gap:.4rem; } }
</style>
</head>
<body>
<header class="navbar">
  <button class="navbar__wordmark" onclick="go('home')">TeachBack <span>AI</span></button>
  <nav class="navbar__links" id="nav-links"></nav>
</header>
<div class="api-bar">
  <span class="api-bar__dot" id="api-dot"></span>
  <span>Backend:</span>
  <input id="api-url" value="http://localhost:8000" />
  <button class="btn btn-ghost btn-small" id="api-check">Check connection</button>
</div>
<main id="root"></main>

<script>
/* ---------------- API client ---------------- */
function apiBase() { return document.getElementById("api-url").value.replace(/\/$/, ""); }

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(apiBase() + path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

async function checkApi() {
  const dot = document.getElementById("api-dot");
  try { await api("/health"); dot.classList.add("ok"); }
  catch { dot.classList.remove("ok"); }
}
document.getElementById("api-check").onclick = checkApi;

/* ---------------- Auth state ---------------- */
let auth = null; // { id, username, name }
try {
  const stored = localStorage.getItem("teachback_auth");
  if (stored) auth = JSON.parse(stored);
} catch {}

function persistAuth() {
  try { localStorage.setItem("teachback_auth", JSON.stringify(auth)); } catch {}
}
function logout() {
  auth = null;
  session = null;
  try { localStorage.removeItem("teachback_auth"); } catch {}
  go("auth");
}

/* ---------------- App state ---------------- */
let view = auth ? "home" : "auth";
let authMode = "login"; // login | register
let concepts = [];
let session = null;
let dashTab = "profile";

// A page reload (or an editor "live reload") used to wipe the in-memory session and drop
// the learner on the home page. The active quiz is now saved and restored.
try {
  const saved = JSON.parse(localStorage.getItem("teachback_state") || "null");
  if (auth && saved && saved.view === "session" && saved.session) { view = "session"; session = saved.session; }
} catch {}
function saveState() {
  try {
    if (view === "session" && session) localStorage.setItem("teachback_state", JSON.stringify({ view, session }));
    else localStorage.removeItem("teachback_state");
  } catch {}
}

function h(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
function esc(s) { return (s ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function go(v) {
  if (v !== "auth" && !auth) v = "auth";
  if (v !== "session") session = null;   // leaving the quiz always starts fresh next time
  view = v;
  renderNav();
  render();
  window.scrollTo(0, 0);
}

function renderNav() {
  const nav = document.getElementById("nav-links");
  nav.innerHTML = "";
  if (!auth) return;
  const conceptsBtn = h(`<button class="link ${view==='home'?'is-active':''}">Concepts</button>`);
  conceptsBtn.onclick = () => go("home");
  const dashBtn = h(`<button class="link ${view==='dashboard'?'is-active':''}">Dashboard</button>`);
  dashBtn.onclick = () => go("dashboard");
  const logoutBtn = h(`<button class="navbar__logout">Log out</button>`);
  logoutBtn.onclick = logout;
  nav.appendChild(conceptsBtn);
  nav.appendChild(dashBtn);
  nav.appendChild(logoutBtn);
}

  const root = document.getElementById("root");
  root.innerHTML = "";
  if (view === "auth") renderAuth(root);
  else if (view === "home") renderHome(root);
  else if (view === "session") renderSession(root);

}

function buildWritingQuestions(detail) {
  const fromPoints = (detail.key_points || []).map(k => k.challenge).filter(Boolean);
  const qs = fromPoints.slice(0, 4);
  if (qs.length < 3 && detail.learning_objective) qs.push(`In your own words, explain: ${detail.learning_objective}`);
  return qs.slice(0, 4);
}

function showStartPanel(wrap, concept) {
  const slot = wrap.querySelector("#start-panel-slot");
  let confidence = null;
  const panel = h(`<section class="start-panel">
    <div class="start-panel__inner">
      <h3>Before you start: ${esc(concept.name)}</h3>
      <p>${esc(concept.description)}</p>
      <p class="start-panel__question">How confident are you that you already understand it?</p>
      <p class="start-panel__hint">1-3 gives you basic questions first; 4-5 starts you on harder, advanced ones.</p>
      <div class="start-panel__scale" id="scale"></div>
      <div class="start-panel__actions">
        <button class="btn btn-ghost" id="cancel">Cancel</button>
        <button class="btn btn-marker" id="go-btn" disabled>Start questions</button>
      </div>
    </div>
  </section>`);
  const scale = panel.querySelector("#scale");
  const goBtn = panel.querySelector("#go-btn");
  [1,2,3,4,5].forEach(n => {
    const dot = h(`<button class="scale-dot">${n}</button>`);
    dot.onclick = () => {
      confidence = n;
      scale.querySelectorAll(".scale-dot").forEach(d => d.classList.remove("is-selected"));
      dot.classList.add("is-selected");

    };

  });
  panel.querySelector("#cancel").onclick = () => { slot.innerHTML = ""; };
  goBtn.onclick = async () => {
    goBtn.disabled = true;
    goBtn.textContent = "Starting…";
    try {
      const s = await api("/sessions", { method: "POST", body: { student_id: auth.id, concept_id: concept.id, self_confidence: confidence } });
      const detail = await api(`/concepts/${concept.id}`);
      session = {
        id: s.id, concept: detail, confidence, stage: "writing", question: null, selected: null, feedback: null,
        progress: { answered: 0, correct: 0, percent: 0 }, summary: null, error: null,
        writingQuestions: buildWritingQuestions(detail), writingAnswers: {},
      };
      go("session");
    } catch (err) {
      alert("Couldn't start the session: " + err.message);
      goBtn.disabled = false;
      goBtn.textContent = "Start questions";
    }
  };
  slot.innerHTML = "";
  slot.appendChild(panel);
  panel.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ================= SESSION (quiz flow) ================= */
/* confidence -> question -> check -> performance -> "more questions?" -> yes: next question / no: final page */
const STAGES = [
  { key: "writing", label: "Explain in your words" },
  { key: "question", label: "Answer the questions" },
  { key: "feedback", label: "Check & performance" },
  { key: "summary", label: "Final results" },
];

function railStageKey() {
  if (session.stage === "summary") return "summary";
  if (session.stage === "feedback") return "feedback";
  if (session.stage === "writing") return "writing";
  return "question";
}

function renderStageRail() {
  const idx = STAGES.findIndex(s => s.key === railStageKey());
  const items = STAGES.map((s, i) => {
    const state = i < idx ? "done" : i === idx ? "active" : "upcoming";
    return `<li data-state="${state}"><span class="stage-rail__marker">${state === "done" ? "✓" : i + 1}</span><span>${s.label}</span></li>`;
  }).join("");
  const p = session.progress || { answered: 0, correct: 0 };
  const tally = p.answered ? `<p class="stage-rail__attempt">Answered: ${p.answered}<br/>Correct: ${p.correct}</p>` : "";
  return h(`<nav class="stage-rail"><ol>${items}</ol>${tally}</nav>`);
}

async function loadNextQuestion() {
  const s = session;
  s.stage = "loading"; s.error = null; s.retry = "next"; render();
  try {
    const r = await api(`/sessions/${s.id}/next-question`);
    if (session !== s) return;              // learner navigated away meanwhile
    s.progress = r.progress;
    if (r.done) { await finishQuiz(); return; }   // nothing left to ask
    s.question = r.question; s.selected = null; s.feedback = null;
    s.stage = "question";
  } catch (err) {
    if (session !== s) return;
    s.stage = "error"; s.error = err.message;
  }
  render();
}

async function finishQuiz() {
  const s = session;
  s.stage = "loading"; s.retry = "finish"; render();
  try {
    const summary = await api(`/sessions/${s.id}/finish`, { method: "POST" });
    if (session !== s) return;
    s.summary = summary; s.stage = "summary";
  } catch (err) {
    if (session !== s) return;
    s.stage = "error"; s.error = err.message;
  }
  render();
}

function optionButton(letter, text, cls = "", tag = "") {
  return h(`<button type="button" class="option-btn ${cls}"><span class="option-btn__letter">${letter}</span><span>${esc(text)}</span>${tag ? `<span class="option-btn__tag">${tag}</span>` : ""}</button>`);
}
const LETTERS = ["A", "B", "C", "D", "E", "F"];

function scoreRow(label, percent) {
  return h(`<div class="score-bars__row"><span>${label}</span>
    <div class="score-bars__track"><div class="score-bars__fill" data-low="${percent < 60}" style="width:${percent}%"></div></div>
    <span class="score-bars__value">${percent}%</span></div>`);
}

function renderSession(root) {
  const wrap = h(`<div class="page session-page"></div>`);
  wrap.appendChild(renderStageRail());

  const main = h(`<div></div>`);
  main.appendChild(h(`<header class="session-page__header">
    <p class="eyebrow-free-label">${esc(session.concept.subject)}</p>
    <h1>${esc(session.concept.name)}</h1>
    <p class="session-page__objective">${esc(session.concept.learning_objective)}</p>
  </header>`));

  if (session.stage === "loading") {
    main.appendChild(h(`<p class="progress-page__empty">Loading…</p>`));
  }

  if (session.stage === "error") {
    const box = h(`<div><div class="error-banner">Something went wrong: ${esc(session.error)}</div>
      <div style="display:flex;gap:.75rem;"><button class="btn btn-marker" id="retry">Try again</button><button class="btn btn-ghost" id="home">Back to concepts</button></div></div>`);
    box.querySelector("#retry").onclick = () => session.retry === "finish" ? finishQuiz() : loadNextQuestion();
    box.querySelector("#home").onclick = () => go("home");
    main.appendChild(box);
  }

  /* ---- 2) writing stage: a few open-ended questions before the MCQs ---- */
  if (session.stage === "writing") {
    const qs = session.writingQuestions || [];
    const answers = session.writingAnswers || (session.writingAnswers = {});
    const block = h(`<section class="diagnosis__block">
      <h2>Explain it in your own words</h2>
      <p class="teach-form__instruction">Answer these ${qs.length} question${qs.length===1?"":"s"} from memory, in a few sentences each. Then you'll move on to a short multiple-choice check.</p>
    </section>`);
    const fields = qs.map((q, i) => {
      const field = h(`<div class="field written-q">
        <label>${i + 1}. ${esc(q)}</label>
        <textarea rows="3" placeholder="Type your explanation here…"></textarea>
      </div>`);
      const ta = field.querySelector("textarea");
      ta.value = answers[i] || "";
      ta.oninput = () => { answers[i] = ta.value; updateContinueState(); };
      block.appendChild(field);
      return ta;
    });
    const actions = h(`<div class="teach-form__actions"><button class="btn btn-marker" id="continue-writing" disabled>Continue to the quiz</button></div>`);
    const continueBtn = actions.querySelector("#continue-writing");
    function updateContinueState() {
      continueBtn.disabled = !fields.every(ta => ta.value.trim().length > 0);
    }
    updateContinueState();
    continueBtn.onclick = () => {
      session.writingAnswers = answers;
      loadNextQuestion();
    };
    block.appendChild(actions);
    main.appendChild(block);
  }

  /* ---- 3) a question, waiting for the learner's answer ---- */
  if (session.stage === "question" && session.question) {
    const q = session.question, p = session.progress;
    const block = h(`<section class="diagnosis__block">
      <span class="level-badge" data-level="${esc(q.level)}">${esc(q.level)} level</span>
      <p class="quiz-meta">Question ${q.number} of ${q.total} · Score so far: ${p.correct}/${p.answered}</p>
      <p class="challenge-card__question">${esc(q.question)}</p>
      <div class="option-list"></div>
      <div class="teach-form__actions"><button class="btn btn-marker" id="check" disabled>Check answer</button></div>
    </section>`);
    const list = block.querySelector(".option-list");
    const checkBtn = block.querySelector("#check");
    const buttons = q.options.map((text, i) => {
      const b = optionButton(LETTERS[i], text);
      b.onclick = () => {
        session.selected = i;
        buttons.forEach((x, j) => x.classList.toggle("is-selected", j === i));
        checkBtn.disabled = false;
      };
      list.appendChild(b);
      return b;
    });
    checkBtn.onclick = async () => {
      if (session.selected === null) return;
      const s = session;
      checkBtn.disabled = true; checkBtn.textContent = "Checking…";
      try {
        const result = await api(`/sessions/${s.id}/answer`, { method: "POST", body: { question_id: q.id, selected_index: s.selected } });
        if (session !== s) return;
        s.feedback = result; s.progress = result.progress; s.stage = "feedback";
        render();
      } catch (err) {
        alert("Couldn't check your answer: " + err.message);
        checkBtn.disabled = false; checkBtn.textContent = "Check answer";
      }
    };
    main.appendChild(block);
  }

  /* ---- 4) result of this answer + performance, then 5/6) "more questions?" ---- */
  if (session.stage === "feedback" && session.question && session.feedback) {
    const q = session.question, f = session.feedback, p = f.progress;
    const block = h(`<section class="diagnosis__block"><h2>Your result</h2></section>`);
    block.appendChild(h(`<p class="challenge-verdict ${f.is_correct ? "challenge-verdict--correct" : "challenge-verdict--incorrect"}">${f.is_correct ? "CORRECT" : "INCORRECT"}</p>`));
    block.appendChild(h(`<p class="challenge-card__question">${esc(q.question)}</p>`));

    const list = h(`<div class="option-list"></div>`);
    q.options.forEach((text, i) => {
      let cls = "", tag = "";
      if (i === f.correct_index) { cls = "is-correct"; tag = i === f.selected_index ? "✓ your answer" : "✓ correct answer"; }
      else if (i === f.selected_index) { cls = "is-wrong"; tag = "✗ your answer"; }
      const b = optionButton(LETTERS[i], text, cls, tag);
      b.disabled = true;
      list.appendChild(b);
    });
    block.appendChild(list);
    block.appendChild(h(`<div class="combined-answer"><strong>Why:</strong> ${esc(f.explanation)}</div>`));

    const perf = h(`<div style="margin-top:1.1rem;"></div>`);
    perf.appendChild(h(`<p class="quiz-meta">Performance so far: ${p.correct} of ${p.answered} correct</p>`));
    perf.appendChild(scoreRow("Score", p.percent));
    block.appendChild(perf);

    const more = h(`<div class="more-detail-prompt"></div>`);
    const row = h(`<div style="display:flex;gap:.75rem;flex-wrap:wrap;"></div>`);
    if (f.has_more) {
      more.appendChild(h(`<p>Would you like more questions?</p>`));
      const yes = h(`<button class="btn btn-marker">Yes, next question</button>`);
      const no = h(`<button class="btn btn-ghost">No, show my final results</button>`);
      yes.onclick = () => loadNextQuestion();
      no.onclick = () => finishQuiz();
      row.appendChild(yes); row.appendChild(no);
    } else {
      more.appendChild(h(`<p>You've answered every question available for this topic.</p>`));
      const fin = h(`<button class="btn btn-marker">See my final results</button>`);
      fin.onclick = () => finishQuiz();
      row.appendChild(fin);
    }
    more.appendChild(row);
    block.appendChild(more);
    main.appendChild(block);
  }

  /* ---- 8) final page ---- */
  if (session.stage === "summary" && session.summary) {
    const s = session.summary;
    const verified = s.verdict === "VERIFIED";
    const block = h(`<section class="diagnosis__block"><h2>Final results</h2></section>`);
    block.appendChild(h(`<p class="challenge-verdict ${verified ? "challenge-verdict--correct" : "challenge-verdict--partial"}">${verified ? "STRONG UNDERSTANDING" : "NEEDS REVISION"}</p>`));
    block.appendChild(h(`<div class="final-score">${s.correct} / ${s.answered} <small>correct · ${s.percent}%</small></div>`));
    block.appendChild(scoreRow("Overall score", s.percent));
    block.appendChild(h(`<p class="diagnosis__status">${verified
      ? "Nicely done — this topic is marked as verified in your profile."
      : "Review the correct answers below, then try this topic again. Your result is saved on your dashboard."}</p>`));
    main.appendChild(block);

    /* ---- combined final answer: written explanations + MCQ score summed up ---- */
    const wq = session.writingQuestions || [];
    const wa = session.writingAnswers || {};
    const writtenCount = wq.filter((_, i) => (wa[i] || "").trim().length > 0).length;

    const finalAnswer = h(`<section class="diagnosis__block"><h2>Your final answer</h2></section>`);
    finalAnswer.appendChild(h(`<p class="combined-answer"><strong>Summed up:</strong> You wrote ${writtenCount} of ${wq.length} explanations in your own words, then answered ${s.answered} multiple-choice question${s.answered === 1 ? "" : "s"} and got ${s.correct} correct (${s.percent}%). ${verified
      ? `Together, that's a strong, verified understanding of ${esc(session.concept.name)}.`
      : `Together, that shows real progress on ${esc(session.concept.name)}, with a few gaps still worth revising -- see the notes below.`}</p>`));
    main.appendChild(finalAnswer);

    /* ---- performance details ---- */
    const perf = h(`<section class="diagnosis__block"><h2>Performance details</h2></section>`);
    perf.appendChild(h(`<p class="quiz-meta">Self-rated confidence before starting: ${session.confidence ?? "--"}/5</p>`));
    perf.appendChild(scoreRow("Written questions completed", wq.length ? Math.round(100 * writtenCount / wq.length) : 0));
    perf.appendChild(scoreRow("MCQ score", s.percent));
    perf.appendChild(scoreRow("Overall result", verified ? 100 : s.percent));
    main.appendChild(perf);

    /* ---- written answers review ---- */
    const writtenRev = h(`<section class="diagnosis__block"><h2>Your written answers</h2></section>`);
    if (wq.length) {
      const wul = h(`<ul class="review-list"></ul>`);
      wq.forEach((q, i) => {
        const given = (wa[i] || "").trim();
        wul.appendChild(h(`<li data-correct="${given.length > 0}">
          <div class="review-list__q">${i + 1}. ${esc(q)}</div>
          <div class="review-list__line written-answer">${esc(given || "(no answer given)")}</div>
        </li>`));
      });
      writtenRev.appendChild(wul);
    } else {
      writtenRev.appendChild(h(`<p class="progress-page__empty">No written questions for this session.</p>`));
    }
    main.appendChild(writtenRev);

    const rev = h(`<section class="diagnosis__block"><h2>Questions and correct answers</h2></section>`);
    const ul = h(`<ul class="review-list"></ul>`);
    s.review.forEach((r, i) => {
      ul.appendChild(h(`<li data-correct="${r.is_correct}">
        <div class="review-list__q">${i + 1}. ${esc(r.question)}</div>
        <div class="review-list__line">Your answer: <strong>${esc(r.options[r.selected_index])}</strong> ${r.is_correct ? "✓" : "✗"}</div>
        ${r.is_correct ? "" : `<div class="review-list__line">Correct answer: <strong>${esc(r.options[r.correct_index])}</strong></div>`}
        <div class="review-list__why">${esc(r.explanation)}</div>
      </li>`));
    });
    rev.appendChild(ul);
    main.appendChild(rev);

    const actions = h(`<div class="final-actions"></div>`);
    const homeBtn = h(`<button class="btn btn-marker">Back to home</button>`);
    homeBtn.onclick = () => go("home");
    const dashBtn = h(`<button class="btn btn-ghost">See my dashboard</button>`);
    dashBtn.onclick = () => go("dashboard");
    actions.appendChild(homeBtn); actions.appendChild(dashBtn);
    main.appendChild(actions);
  }

  wrap.appendChild(main);
  root.appendChild(wrap);
}

async function renderDashboard(root) {
  const wrap = h(`<div class="page dashboard-page">
    <h1>Your dashboard</h1>
    <div class="dash-tabs">
      <button data-tab="profile">Profile</button>
      <button data-tab="performance">Performance</button>

async function renderProfileTab(content) {
  try {
    const student = await api(`/students/${auth.id}`);
    const card = h(`<div class="profile-card">
      <div class="profile-card__row"><span class="profile-card__label">Name</span><span>${esc(student.name)}</span></div>
      <div class="profile-card__row"><span class="profile-card__label">Username</span><span>${esc(student.username)}</span></div>
      <div class="profile-card__row"><span class="profile-card__label">Student ID</span><span>${esc(student.student_code || "--")}</span></div>
      <div class="profile-card__row"><span class="profile-card__label">Member since</span><span>${new Date(student.created_at).toLocaleDateString()}</span></div>
    </div>`);
    content.appendChild(card);
    const logoutBtn = h(`<button class="btn btn-ghost" style="margin-top:1.2rem;">Log out</button>`);
    logoutBtn.onclick = logout;
    content.appendChild(logoutBtn);
  } catch (err) {
    content.appendChild(h(`<div class="error-banner">Couldn't load your profile -- ${esc(err.message)}</div>`));
  }
}

const STATUS_LABEL = { VERIFIED: "Verified", NEEDS_REINFORCEMENT: "Needs revision", IN_PROGRESS: "In progress" };

async function renderPerformanceTab(content) {
  try {
    const [profiles, weakAreas] = await Promise.all([api(`/students/${auth.id}/progress`), api(`/students/${auth.id}/weak-areas`)]);
    if (!profiles.length) {
      content.appendChild(h(`<p class="progress-page__empty">You haven't taught anything yet -- head to Concepts to get started.</p>`));
      return;
    }
    const ledger = h(`<div class="ledger"></div>`);
    profiles.forEach(p => {
      ledger.appendChild(h(`<div class="ledger__row">
        <div class="ledger__name"><span>${esc(p.concept_name)}</span>
          <span class="ledger__status ledger__status--${p.verification_status.toLowerCase()}">${STATUS_LABEL[p.verification_status] || p.verification_status}</span></div>
        <div class="ledger__bar"><div class="ledger__fill" style="width:${Math.round(p.understanding_score)}%"></div></div>
        <span class="ledger__score">${Math.round(p.understanding_score)}%</span>
        <span class="ledger__attempts">${p.attempts_count} attempt${p.attempts_count===1?"":"s"}</span>
      </div>`));
    });
    content.appendChild(ledger);

    const section = h(`<section class="weak-areas"><h2>Revision list</h2></section>`);
    if (!weakAreas.length) {
      section.appendChild(h(`<p class="progress-page__empty">No open gaps right now -- nice work.</p>`));
    } else {
      const ul = h(`<ul></ul>`);
      weakAreas.forEach(w => ul.appendChild(h(`<li><span class="weak-areas__concept">${esc(w.concept_name)}</span><span class="weak-areas__desc">${esc(w.description)}</span></li>`)));
      section.appendChild(ul);
    }
    content.appendChild(section);
  } catch (err) {
    content.appendChild(h(`<div class="error-banner">Couldn't load your performance -- ${esc(err.message)}</div>`));
  }
}

/* ---------------- Boot ---------------- */
checkApi();
renderNav();
render();
if (view === "session" && session && (session.stage === "loading" || session.stage === "error")) {
  if (session.retry === "finish") finishQuiz(); else loadNextQuestion();
}
</script>
